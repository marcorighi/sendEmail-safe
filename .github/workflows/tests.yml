name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite
        run: ./run-tests.sh

  release_archive:
    runs-on: ubuntu-latest
    steps:
      - name: Verify immutable upstream source snapshot for 1.2.0
        shell: bash
        run: |
          set -euo pipefail
          source_commit=c1dac524b3b58e5521e73f5e52eaeea14e781fcd
          curl --fail --location --retry 3 --silent --show-error \
            "https://codeload.github.com/marcorighi/sendEmail-safe/tar.gz/${source_commit}" \
            -o source-1.2.0.tar.gz
          sha256sum source-1.2.0.tar.gz
          tar -tzf source-1.2.0.tar.gz | head -n 5
